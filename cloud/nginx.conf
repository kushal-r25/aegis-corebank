server {
    listen 80;
    server_name localhost _;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Health check
    location /health {
        return 200 '{"status":"UP","gateway":"aegis-cloud-ingress"}';
        add_header Content-Type application/json;
    }

    # API Routing — Auth Service (:8081)
    location /api/auth {
        proxy_pass http://127.0.0.1:8081/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routing — Account Service (:8082)
    location /api/accounts {
        proxy_pass http://127.0.0.1:8082/accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routing — Transaction Service (:8083) Transfers
    location /api/transfers {
        proxy_pass http://127.0.0.1:8083/transfers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routing — Transaction Service (:8083) Fraud
    location /api/fraud {
        proxy_pass http://127.0.0.1:8083/fraud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routing — Notification Service (:8084)
    location /api/notifications {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static React Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
