# ===================================================
# Aegis CoreBank — Production Ingress / Reverse Proxy
# ===================================================

upstream frontend_upstream {
    server frontend:80;
}

upstream auth_upstream {
    server auth-service:8081;
}

upstream account_upstream {
    server account-service:8082;
}

upstream transaction_upstream {
    server transaction-service:8083;
}

upstream notification_upstream {
    server notification-service:8084;
}

server {
    listen 80;
    server_name localhost _;

    # Client body limit for file/batch submissions
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health Check Probe
    location /health {
        access_log off;
        return 200 '{"status":"UP","gateway":"aegis-nginx"}';
        add_header Content-Type application/json;
    }

    # API Routing — Auth Service (:8081)
    location /api/auth {
        proxy_pass http://auth_upstream/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API Routing — Account Service (:8082)
    location /api/accounts {
        proxy_pass http://account_upstream/accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API Routing — Transaction Service (:8083) Transfers
    location /api/transfers {
        proxy_pass http://transaction_upstream/transfers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API Routing — Transaction Service (:8083) Fraud
    location /api/fraud {
        proxy_pass http://transaction_upstream/fraud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API Routing — Notification Service (:8084)
    location /api/notifications {
        proxy_pass http://notification_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Static React Frontend SPA Proxy
    location / {
        proxy_pass http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
