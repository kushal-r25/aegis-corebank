services:
  postgres-account:
    image: postgres:16
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["5433:5432"]
    volumes: ["pg_account_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-transaction:
    image: postgres:16
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["5434:5432"]
    volumes: ["pg_txn_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["5435:5432"]
    volumes: ["pg_auth_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # --- application services (build from local Dockerfiles) ---
  # Uncomment once you've built and tested each service individually with
  # `mvn spring-boot:run`. Bringing all 4 up via compose from day one makes it
  # harder to tell which service is misbehaving.
  #
  # auth-service:
  #   build: { context: ., dockerfile: auth-service/Dockerfile }
  #   ports: ["8081:8081"]
  #   depends_on: [postgres-auth]
  #   environment:
  #     DB_HOST: postgres-auth
  #     DB_PORT: 5432
  #
  # account-service:
  #   build: { context: ., dockerfile: account-service/Dockerfile }
  #   ports: ["8082:8082"]
  #   depends_on: [postgres-account, redis, kafka]
  #   environment:
  #     DB_HOST: postgres-account
  #     DB_PORT: 5432
  #     REDIS_HOST: redis
  #     KAFKA_BROKERS: kafka:9092
  #
  # transaction-service:
  #   build: { context: ., dockerfile: transaction-service/Dockerfile }
  #   ports: ["8083:8083"]
  #   depends_on: [postgres-transaction, kafka, account-service]
  #   environment:
  #     DB_HOST: postgres-transaction
  #     DB_PORT: 5432
  #     KAFKA_BROKERS: kafka:9092
  #     ACCOUNT_SERVICE_URL: http://account-service:8082
  #
  # notification-service:
  #   build: { context: ., dockerfile: notification-service/Dockerfile }
  #   ports: ["8084:8084"]
  #   depends_on: [kafka]
  #   environment:
  #     KAFKA_BROKERS: kafka:9092

volumes:
  pg_account_data:
  pg_txn_data:
  pg_auth_data:
