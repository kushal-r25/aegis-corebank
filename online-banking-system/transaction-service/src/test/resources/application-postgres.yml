spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/transaction_db?options=-c%20timezone%3DUTC
    username: bank
    password: bank
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
jwt:
  secret: test-secret-key-for-junit-only-min-32-bytes-long
