server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/transaction_db?options=-c%20timezone%3DUTC
    username: bank
    password: bank
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: transaction-service-saga
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

services:
  account:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:this-is-a-local-dev-secret-change-in-prod-min-32-bytes-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bank: DEBUG
